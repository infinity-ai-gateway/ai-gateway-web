<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../assets/static/css/app.css" />
  <link rel="stylesheet" href="../assets/static/css/cluster.list.css" />
  <link rel="stylesheet" href="../assets/font/iconfont.css" />
  <link rel="stylesheet" href="../assets/css/prototype-overrides.css" />
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/ivu-ui.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/prototype.js"></script>
</head>
<body>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var isEdit = location.search.indexOf('edit=1') >= 0;
  var root = Layout.render({ pageId: 'AICluster.list', breadcrumb: isEdit ? '编辑集群' : '添加集群', basePath: '../' });
  var titles = ['基本配置', '超时/重试', '被动健康检查', '大模型配置', '审核检查'];
  root.innerHTML =
    '<div id="steps-bar"></div>' +
    '<div id="step-0" class="step-panel">' + stepBasic() + '</div>' +
    '<div id="step-1" class="step-panel proto-hidden-inline">' + stepTimeout() + '</div>' +
    '<div id="step-2" class="step-panel proto-hidden-inline">' + stepHealth() + '</div>' +
    '<div id="step-3" class="step-panel proto-hidden-inline">' + stepModel() + '</div>' +
    '<div id="step-4" class="step-panel proto-hidden-inline">' + stepReview() + '</div>' +
    '<div class="com-btn-box">' +
      IvuUI.btn('上一步', 'default', 'default', '', 'id="btn-prev"') + ' ' +
      IvuUI.btn('下一步', 'primary', 'default', '', 'id="btn-next"') + ' ' +
      IvuUI.btn('提交', 'primary', 'default', 'proto-hidden-inline', 'id="btn-submit"') + ' ' +
      IvuUI.btn('取消', 'default', 'default', '', 'onclick="location.href=\'cluster-list.html\'"') +
    '</div>';

  var panels = [];
  for (var i = 0; i < 5; i++) panels.push(document.getElementById('step-' + i));
  Prototype.initSteps({
    stepsBar: document.getElementById('steps-bar'),
    titles: titles,
    panels: panels,
    nextBtn: document.getElementById('btn-next'),
    prevBtn: document.getElementById('btn-prev'),
    submitBtn: document.getElementById('btn-submit'),
    redirect: 'cluster-list.html'
  });
});

function stepBasic() {
  return IvuUI.card('基本配置', '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">' +
    IvuUI.formItem('集群名称', IvuUI.input('llm-cluster-a', ''), true) +
    IvuUI.formItem('协议', IvuUI.select(['HTTP', 'HTTPS'], 'HTTP')) + '</div>');
}
function stepTimeout() {
  return IvuUI.card('超时/重试', IvuUI.formItem('连接超时(ms)', IvuUI.input('3000', '')));
}
function stepHealth() {
  return IvuUI.card('被动健康检查', IvuUI.formItem('启用', IvuUI.select(['是', '否'], '是')));
}
function stepModel() {
  var providers = (MockData.providers || []).map(function (item) { return item.name; });
  return IvuUI.card('大模型配置',
    IvuUI.formItem('所属服务商', IvuUI.select(providers, 'deepseek'), true) +
    IvuUI.formItem('转发模型', IvuUI.input('deepseek-chat', '')));
}
function stepReview() {
  return IvuUI.card('审核检查',
    '<div class="info-row"><span class="info-label">集群名称</span><span>llm-cluster-a</span></div>' +
    '<div class="info-row"><span class="info-label">所属服务商</span><span>deepseek</span></div>');
}
</script>
<style>.info-row{display:flex;padding:8px 0}.info-label{width:140px;color:#808695}.step-panel{margin-top:16px}</style>
</body>
</html>
