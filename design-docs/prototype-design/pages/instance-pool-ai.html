<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../assets/static/css/app.css" />
  <link rel="stylesheet" href="../assets/static/css/instance-pool-ai.css" />
  <link rel="stylesheet" href="../assets/font/iconfont.css" />
  <link rel="stylesheet" href="../assets/css/prototype-overrides.css" />
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/ivu-ui.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/prototype.js"></script>
</head>
<body>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var root = Layout.render({ pageId: 'AIGatewayInstancePool.list', basePath: '../' });
  root.innerHTML = '<div class="ai-instance-pool" id="instance-pool-app"></div>';

  var state = {
    isEditing: false,
    instances: cloneInstances(MockData.gatewayInstances)
  };

  function cloneInstances(list) {
    return (list || []).map(function (item) {
      return {
        hostname: item.hostname || '',
        ip: item.ip || '',
        port: item.port != null ? item.port : 80
      };
    });
  }

  function createEmptyInstance() {
    return { hostname: '', ip: '', port: 80 };
  }

  function escapeAttr(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;');
  }

  function renderViewRow(item) {
    return '<tr>' +
      '<td><span class="cell-text">' + (item.hostname || '-') + '</span></td>' +
      '<td><span class="cell-text">' + (item.ip || '-') + '</span></td>' +
      '<td><span class="cell-text">' + (item.port != null ? item.port : '-') + '</span></td>' +
    '</tr>';
  }

  function renderEditRow(item, index) {
    return '<tr data-index="' + index + '">' +
      '<td><div class="ivu-input-wrapper ivu-input-type-text">' +
        '<input type="text" class="ivu-input" data-field="hostname" value="' + escapeAttr(item.hostname) + '" placeholder="请输入机器名" />' +
      '</div></td>' +
      '<td><div class="ivu-input-wrapper ivu-input-type-text">' +
        '<input type="text" class="ivu-input" data-field="ip" value="' + escapeAttr(item.ip) + '" placeholder="请输入ip/域名" />' +
      '</div></td>' +
      '<td>' +
        '<div class="ivu-input-wrapper poolInput" style="width:80px;display:inline-block;vertical-align:middle;">' +
          '<input type="number" class="ivu-input" data-field="port" min="1" max="65535" value="' + escapeAttr(item.port) + '" placeholder="端口值" />' +
        '</div>' +
      '</td>' +
    '</tr>';
  }

  function collectInstancesFromForm() {
    var rows = document.querySelectorAll('#instance-pool-table tbody tr[data-index]');
    var list = [];
    rows.forEach(function (row) {
      list.push({
        hostname: row.querySelector('[data-field="hostname"]').value.trim(),
        ip: row.querySelector('[data-field="ip"]').value.trim(),
        port: parseInt(row.querySelector('[data-field="port"]').value, 10)
      });
    });
    return list;
  }

  function validateInstances(list) {
    if (!list.length) {
      Prototype.toast('至少保留一个实例', 'error');
      return false;
    }
    var ipPortSet = {};
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      if (!item.hostname) {
        Prototype.toast('请输入机器名', 'error');
        return false;
      }
      if (!item.ip) {
        Prototype.toast('请输入ip/域名', 'error');
        return false;
      }
      if (!Number.isFinite(item.port) || item.port < 1 || item.port > 65535) {
        Prototype.toast('Default端口错误, 范围1～65535', 'error');
        return false;
      }
      var ipPort = item.ip + ':' + item.port;
      if (ipPortSet[ipPort]) {
        Prototype.toast('实例 IP/域名 和端口不能重复: "' + ipPort + '"', 'error');
        return false;
      }
      ipPortSet[ipPort] = true;
    }
    return true;
  }

  function render() {
    var app = document.getElementById('instance-pool-app');
    var toolbar = state.isEditing ? '' :
      '<div class="page-toolbar">' + IvuUI.btn('编辑', 'primary', 'default', '', 'id="btn-start-edit"') + '</div>';

    var tableHead = '<tr><th>机器名</th><th>ip/域名</th><th>端口</th></tr>';

    var tableBody = '';
    if (!state.instances.length && !state.isEditing) {
      tableBody = '<tr><td colspan="3" class="empty-cell">暂无数据</td></tr>';
    } else {
      tableBody = state.instances.map(function (item, index) {
        return state.isEditing ? renderEditRow(item, index) : renderViewRow(item);
      }).join('');
    }

    var footer = state.isEditing
      ? '<div class="footer-actions">' +
          IvuUI.btn('提交', 'primary', 'small', '', 'id="btn-submit-edit"') + ' ' +
          IvuUI.btn('取消', 'default', 'small', '', 'id="btn-cancel-edit"') +
        '</div>'
      : '';

    app.innerHTML =
      toolbar +
      '<div class="ivu-form ivu-form-label-top">' +
        '<div class="ivu-form-item">' +
          '<label class="ivu-form-item-label">实例IP列表</label>' +
          '<div class="ivu-form-item-content">' +
            '<div class="formBox">' +
              '<table id="instance-pool-table" border="0" cellspacing="0" cellpadding="0">' +
                tableHead + tableBody +
              '</table>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      footer;

    bindEvents();
  }

  function bindEvents() {
    var startEditBtn = document.getElementById('btn-start-edit');
    if (startEditBtn) {
      startEditBtn.addEventListener('click', function () {
        if (!state.instances.length) {
          state.instances = [createEmptyInstance()];
        } else {
          state.instances = state.instances.slice(0, 1);
        }
        state.isEditing = true;
        render();
      });
    }

    var submitBtn = document.getElementById('btn-submit-edit');
    if (submitBtn) {
      submitBtn.addEventListener('click', function () {
        var list = collectInstancesFromForm().slice(0, 1);
        if (!validateInstances(list)) return;
        state.instances = list;
        MockData.gatewayInstances = cloneInstances(list);
        state.isEditing = false;
        Prototype.toast('修改成功');
        render();
      });
    }

    var cancelBtn = document.getElementById('btn-cancel-edit');
    if (cancelBtn) {
      cancelBtn.addEventListener('click', function () {
        state.instances = cloneInstances(MockData.gatewayInstances);
        state.isEditing = false;
        render();
      });
    }
  }

  render();
});
</script>
</body>
</html>
