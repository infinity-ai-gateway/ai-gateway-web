<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../assets/static/css/app.css" />
  <link rel="stylesheet" href="../assets/static/css/cluster.list.css" />
  <link rel="stylesheet" href="../assets/font/iconfont.css" />
  <link rel="stylesheet" href="../assets/css/prototype-overrides.css" />
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/ivu-ui.js"></script>
  <script src="../assets/js/cluster-upsert.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/prototype.js"></script>
</head>
<body>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var root = Layout.render({ pageId: 'AICluster.list', basePath: '../' });
  root.innerHTML =
    '<div class="clusters">' +
      IvuUI.btn('添加集群', 'primary', 'small', '', 'id="btn-add-cluster"') +
      '<div id="cluster-table"></div>' +
    '</div>' +
    drawerUpsert() +
    drawerDetail();

  var upsertController = null;
  var state = {
    allRows: cloneRows(MockData.clusters),
    filteredRows: cloneRows(MockData.clusters),
    searchName: '',
    pageSize: 20,
    currentPage: 1
  };

  function cloneRows(list) {
    return (list || []).map(function (item) {
      return { name: item.name || '', description: item.description || '' };
    });
  }

  function escapeAttr(value) {
    return IvuUI.escapeHtml(value);
  }

  function filterRows() {
    var keyword = state.searchName.trim().toUpperCase();
    if (!keyword) {
      state.filteredRows = cloneRows(state.allRows);
      return;
    }
    state.filteredRows = state.allRows.filter(function (row) {
      return String(row.name || '').toUpperCase().indexOf(keyword) !== -1;
    });
  }

  function getPageRows() {
    var start = (state.currentPage - 1) * state.pageSize;
    return state.filteredRows.slice(start, start + state.pageSize);
  }

  function renderTable() {
    filterRows();
    var totalPages = Math.max(1, Math.ceil(state.filteredRows.length / state.pageSize));
    if (state.currentPage > totalPages) state.currentPage = totalPages;

    var container = document.getElementById('cluster-table');
    container.innerHTML = IvuUI.pageTable({
      columns: [
        {
          title: '名称',
          key: 'name',
          sortable: true,
          searchable: true,
          searchPlaceholder: '请输入名称查询'
        },
        { title: '描述', key: 'description' },
        {
          title: '操作',
          key: 'action',
          render: function (row) {
            return IvuUI.btn('详情', 'success', 'small', '', 'style="margin-right:5px;" data-action="detail" data-name="' + escapeAttr(row.name) + '"') +
              IvuUI.btn('编辑', 'primary', 'small', '', 'style="margin-right:5px;" data-action="edit" data-name="' + escapeAttr(row.name) + '"') +
              IvuUI.btn('删除', 'error', 'small', '', 'data-action="delete" data-name="' + escapeAttr(row.name) + '"');
          }
        }
      ],
      rows: getPageRows(),
      total: state.filteredRows.length,
      pageSize: state.pageSize,
      currentPage: state.currentPage,
      searchValues: { name: state.searchName },
      tableId: 'cluster-page-table'
    });

    bindTableEvents(container);
  }

  function bindTableEvents(container) {
    Prototype.bindPageTableSearch(container, function (key, value) {
      state.searchName = value;
      state.currentPage = 1;
      renderTable();
    });

    var sizeSelect = container.querySelector('.proto-page-size');
    if (sizeSelect) {
      sizeSelect.addEventListener('change', function () {
        state.pageSize = parseInt(sizeSelect.value, 10) || 20;
        state.currentPage = 1;
        renderTable();
      });
    }

    var prevBtn = container.querySelector('.proto-page-prev');
    if (prevBtn) {
      prevBtn.addEventListener('click', function () {
        if (state.currentPage > 1) {
          state.currentPage -= 1;
          renderTable();
        }
      });
    }

    var nextBtn = container.querySelector('.proto-page-next');
    if (nextBtn) {
      nextBtn.addEventListener('click', function () {
        var totalPages = Math.max(1, Math.ceil(state.filteredRows.length / state.pageSize));
        if (state.currentPage < totalPages) {
          state.currentPage += 1;
          renderTable();
        }
      });
    }

    container.querySelectorAll('.el-pager .number').forEach(function (item) {
      item.addEventListener('click', function () {
        state.currentPage = parseInt(item.getAttribute('data-page'), 10) || 1;
        renderTable();
      });
    });

    container.querySelectorAll('[data-action]').forEach(function (btn) {
      btn.addEventListener('click', function (event) {
        event.stopPropagation();
        var name = btn.getAttribute('data-name');
        var row = state.allRows.find(function (item) { return item.name === name; }) || { name: name, description: '' };
        var action = btn.getAttribute('data-action');
        if (action === 'detail') openDetail(row);
        else if (action === 'edit') openUpsert(false, row);
        else if (action === 'delete') {
          Prototype.confirmDelete('是否删除' + name + '？', function () {
            state.allRows = state.allRows.filter(function (item) { return item.name !== name; });
            renderTable();
          });
        }
      });
    });
  }

  function openUpsert(isAdd, row) {
    var drawer = document.getElementById('drawer-cluster-upsert');
    if (!drawer) return;

    var titleEl = drawer.querySelector('.ivu-drawer-header-inner');
    if (titleEl) titleEl.textContent = isAdd ? '添加集群' : '编辑集群';

    var body = drawer.querySelector('.ivu-drawer-body');
    if (!body) return;

    upsertController = ClusterUpsert.mount(
      body,
      document.getElementById('cluster-upsert-footer'),
      {
      isAdd: isAdd,
      row: row,
      onSubmit: function (data) {
        var name = data.baseConfigData.name.trim();
        var desc = data.baseConfigData.description || '';
        if (!name) {
          Prototype.toast('请输入集群名称', 'error');
          return;
        }
        if (isAdd) {
          state.allRows.push({ name: name, description: desc });
        } else {
          var target = state.allRows.find(function (item) { return item.name === row.name; });
          if (target) {
            target.name = name;
            target.description = desc;
          }
        }
        Prototype.closeDrawer('drawer-cluster-upsert');
        Prototype.toast('提交成功！');
        renderTable();
      }
    });

    Prototype.openDrawer('drawer-cluster-upsert');
  }

  function openDetail(row) {
    var detailBody = document.getElementById('cluster-detail-body');
    if (detailBody) {
      var data = ClusterUpsert.createDefaultData(row);
      detailBody.innerHTML = ClusterUpsert.renderReview(data);
    }
    Prototype.openDrawer('drawer-cluster-detail');
  }

  document.getElementById('btn-add-cluster').addEventListener('click', function () {
    openUpsert(true, { name: '', description: '' });
  });

  renderTable();
  Prototype.bindDrawerClose();
});

function drawerUpsert() {
  return IvuUI.drawer('drawer-cluster-upsert', '添加集群',
    '<div id="cluster-upsert-body"></div>',
    '<div id="cluster-upsert-footer"></div>',
    '80%');
}

function drawerDetail() {
  return IvuUI.drawer('drawer-cluster-detail', '详情',
    '<div id="cluster-detail-body"></div>',
    IvuUI.btn('关闭', 'primary', 'default', '', 'data-close-drawer="drawer-cluster-detail"'), '80%');
}
</script>
</body>
</html>
